[project]
name = "latentqa"
version = "0.0.1"
description = "LatentQA"

requires-python = "==3.12.*"
dependencies = [
    "neurondb",
    "user_modeling",
    "llm_util",
    "util",
    "peft>=0.15.0",
    "wandb>=0.19.6",
    "jupyter>=1.0.0",
    "vllm>=0.7.0",
    "plotly",
    "treescope",
]

[tool.uv.sources]
neurondb = {path = "../../lib/neurondb", editable = true}
util = {path = "../../lib/util", editable = true}
llm_util = {path = "../../lib/llm_util", editable = true}
user_modeling = {path = "../user_modeling", editable = true}
vllm = { git = "https://github.com/vllm-project/vllm", tag = "v0.7.0", marker = "platform_system == 'Darwin'" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["latentqa"]

[tool.pyright]
strict = ["latentqa"]
reportMissingTypeStubs = false

[tool.hatch.metadata]
allow-direct-references = true
