[project]
name = "user_modeling"
version = "0.0.1"
description = "User Modeling"

requires-python = "==3.12.*"
dependencies = [
    "latentqa",
    "pandas",
    "aiosqlite>=0.21.0",
    "llm_util",
    "log_util",
    "jupyter>=1.0.0",
    "vllm==0.7.0",
]

[tool.uv.sources]
llm_util = {path = "../../lib/llm_util", editable = true}
log_util = {path = "../../lib/log_util", editable = true}
latentqa = {path = "../latentqa", editable = true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["user_modeling"]

[tool.pyright]
strict = ["user_modeling"]
reportMissingTypeStubs = false

[tool.hatch.metadata]
allow-direct-references = true
